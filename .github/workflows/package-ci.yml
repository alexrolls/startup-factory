name: Package CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Validate package version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Read the package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require an unreleased version before merge
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(
            git show "origin/$BASE_REF:pyproject.toml" |
              python -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])'
          )"
          # A base version with no tag has not been released yet, so a PR may
          # keep it; it only has to move forward once the base is published.
          base_released=false
          if git rev-parse -q --verify "refs/tags/v$base_version^{commit}" >/dev/null; then
            base_released=true
          fi
          python - "$base_version" "$VERSION" "$base_released" <<'PY'
          import re
          import sys

          base, proposed, base_released = sys.argv[1:]
          stable = re.compile(r"[0-9]+\.[0-9]+\.[0-9]+")
          if stable.fullmatch(base) is None or stable.fullmatch(proposed) is None:
              raise SystemExit("release versions must use stable numeric SemVer")
          base_key = tuple(map(int, base.split(".")))
          proposed_key = tuple(map(int, proposed.split(".")))
          if proposed_key < base_key or (
              proposed_key == base_key and base_released == "true"
          ):
              raise SystemExit(
                  f"project.version must increase before merge: {base} -> {proposed}"
              )
          PY
          if git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" >/dev/null; then
            echo "v$VERSION is already published; bump project.version before merging" >&2
            exit 1
          fi

  minimum-python:
    name: Python 3.10 source compatibility
    if: github.event_name == 'pull_request'
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up the minimum supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Prove source compatibility on Python 3.10
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.version_info[:2] == (3, 10), sys.version'
          python -m startup_factory_cli version --json
          python -m unittest discover -s tests/packaging -p "test_*.py" -v

  runtime:
    name: Runtime (${{ matrix.shard }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [dispatch, launcher, parallel-integration, task-runtime, deployment, core]
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up protected Python
        id: runtime-python
        uses: ./.github/actions/protected-python

      - name: Run the runtime shard
        env:
          TEST_SHARD: ${{ matrix.shard }}
          SETUP_PREFIX: ${{ steps.runtime-python.outputs.prefix }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_tmp="$RUNNER_TEMP/startup-factory-runtime"
          # Lifecycle sockets must fit AF_UNIX limits. Keep HOME short and
          # below the protected runner home, outside shared temporary roots.
          runtime_home="$(mktemp -d "$HOME/.h.XXXXXX")"
          trap 'rm -rf "$runtime_home"' EXIT
          install -d -m 700 "$runtime_tmp" "$runtime_home"
          PATH="$SETUP_PREFIX/bin:/usr/bin:/bin" HOME="$runtime_home" \
            TMPDIR="$runtime_tmp" /bin/bash tests/run-all.sh --shard "$TEST_SHARD"

  artifacts:
    name: Package and reproducible artifacts
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up protected Python
        uses: ./.github/actions/protected-python

      - name: Run packaging unit tests
        run: python -m unittest discover -s tests/packaging -p "test_*.py" -v

      - name: Build the source bundle twice
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          mkdir -p build/repro-a build/repro-b
          python packaging/build_bundle.py \
            --repo . \
            --commit "$commit" \
            --version "$VERSION" \
            --output "build/repro-a/startup-factory-$VERSION.tar.gz"
          python packaging/build_bundle.py \
            --repo . \
            --commit "$commit" \
            --version "$VERSION" \
            --output "build/repro-b/startup-factory-$VERSION.tar.gz"

      - name: Verify byte-for-byte bundle reproducibility
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cmp \
            "build/repro-a/startup-factory-$VERSION.tar.gz" \
            "build/repro-b/startup-factory-$VERSION.tar.gz"
          cmp \
            "build/repro-a/startup-factory-$VERSION.tar.gz.sha256" \
            "build/repro-b/startup-factory-$VERSION.tar.gz.sha256"
          (
            cd build/repro-a
            sha256sum --check "startup-factory-$VERSION.tar.gz.sha256"
          )
          (
            cd build/repro-b
            sha256sum --check "startup-factory-$VERSION.tar.gz.sha256"
          )

      - name: Prepare two clean package source trees
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          for slot in a b; do
            package_tree="build/package-$slot"
            resource_dir="$package_tree/src/startup_factory_cli/resources"
            mkdir -p "$package_tree" "$resource_dir"
            git archive "$commit" | tar -x -C "$package_tree"
            cp \
              "build/repro-a/startup-factory-$VERSION.tar.gz" \
              "$resource_dir/startup-factory.tar.gz"
            (
              cd "$resource_dir"
              sha256sum startup-factory.tar.gz > startup-factory.tar.gz.sha256
            )
          done

      - name: Build wheel and sdist twice with an isolated pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_TOOL_CACHE" = "/opt/hostedtoolcache"
          shopt -s nullglob
          setup_prefixes=("$RUNNER_TOOL_CACHE"/Python/3.14.*/x64)
          test "${#setup_prefixes[@]}" -eq 1
          setup_prefix="${setup_prefixes[0]}"
          protected_python="$setup_prefix/bin/python3"
          "$protected_python" -I -B -S -E -s - "$setup_prefix" <<'PY'
          import stat
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve(strict=True)
          assert sys.version_info[:2] == (3, 14), sys.version
          assert Path(sys.executable).resolve(strict=True).is_relative_to(root)
          assert Path(sys.prefix).resolve(strict=True) == root
          assert Path(sys.base_prefix).resolve(strict=True) == root
          current = root
          while True:
              info = current.lstat()
              assert not stat.S_ISLNK(info.st_mode), current
              assert info.st_uid == 0, current
              assert not stat.S_IMODE(info.st_mode) & 0o022, current
              if current == Path("/"):
                  break
              current = current.parent
          PY
          build_env="$(mktemp -d "$RUNNER_TEMP/startup-factory-build.XXXXXX")"
          "$protected_python" -I -B -m venv --copies "$build_env"
          build_python="$build_env/bin/python"
          "$build_python" -I -B -E -s - "$setup_prefix" "$build_env" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve(strict=True)
          environment = Path(sys.argv[2]).resolve(strict=True)
          assert sys.version_info[:2] == (3, 14), sys.version
          assert Path(sys.executable).resolve(strict=True).is_relative_to(environment)
          assert Path(sys.prefix).resolve(strict=True) == environment
          assert Path(sys.base_prefix).resolve(strict=True) == root
          PY
          "$build_python" -I -B -m pip install --disable-pip-version-check \
            build==1.3.0 packaging==26.2 pyproject-hooks==1.2.0 \
            setuptools==83.0.0 wheel==0.47.0
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          "$build_python" -I -B -m build --no-isolation --outdir "$PWD/build/dist-a" "$PWD/build/package-a"
          "$build_python" -I -B -m build --no-isolation --outdir "$PWD/build/dist-b" "$PWD/build/package-b"

      - name: Normalize sdist container metadata deterministically
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          python tests/packaging/test_packaging_metadata.py \
            --canonicalize-sdist build/dist-a/*.tar.gz "$source_date_epoch"
          python tests/packaging/test_packaging_metadata.py \
            --canonicalize-sdist build/dist-b/*.tar.gz "$source_date_epoch"

      - name: Prove distribution reproducibility and promote one set
        shell: bash
        run: |
          set -euo pipefail
          first=(build/dist-a/*)
          second=(build/dist-b/*)
          test "${#first[@]}" -eq 2
          test "${#second[@]}" -eq 2
          for artifact in "${first[@]}"; do
            name="$(basename "$artifact")"
            test -f "build/dist-b/$name"
            cmp "$artifact" "build/dist-b/$name"
          done
          mkdir -p dist
          cp build/dist-a/* dist/

      - name: Verify wheel and sdist bundle identity
        env:
          STARTUP_FACTORY_BUNDLE: ${{ github.workspace }}/build/repro-a/startup-factory-${{ needs.version.outputs.version }}.tar.gz
          STARTUP_FACTORY_DIST_DIR: ${{ github.workspace }}/dist
        run: python -m unittest discover -s tests/packaging -p "test_*.py" -v

  package:
    # Preserve the required check configured in the main branch ruleset.
    name: Runtime, package, and reproducible artifacts
    if: always()
    needs: [version, minimum-python, runtime, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs to pass
        env:
          VERSION_RESULT: ${{ needs.version.result }}
          MINIMUM_RESULT: ${{ needs.minimum-python.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          ARTIFACTS_RESULT: ${{ needs.artifacts.result }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION_RESULT" = success
          test "$RUNTIME_RESULT" = success
          test "$ARTIFACTS_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$MINIMUM_RESULT" = success
          else
            test "$MINIMUM_RESULT" = skipped
          fi
